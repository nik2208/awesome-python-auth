<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password</title><link rel="stylesheet" href="base.css"></head>
<body>
    <div class="auth-container">
        <img src="" alt="Logo" class="logo hidden">
        <h1 class="site-name">Awesome Auth</h1>
        <h2>Set New Password</h2>
        <div id="alert" class="alert hidden"></div>
        <form id="reset-form">
            <div class="form-group"><label for="password">New Password</label><input type="password" id="password" name="password" required></div>
            <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" name="confirmPassword" required></div>
            <button type="submit" id="submit-btn">Save New Password</button>
        </form>
        <div id="success-message" class="hidden">
            <div class="alert alert-success">Password reset successfully!</div>
            <p class="footer-links"><a href="login">Proceed to login</a></p>
        </div>
    </div>
    <script src="auth.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthService.init();
            const token = new URLSearchParams(window.location.search).get('token');
            const form = document.getElementById('reset-form');
            const alert = document.getElementById('alert');
            const submitBtn = document.getElementById('submit-btn');
            if (!token) { alert.textContent = 'Invalid reset token.'; alert.classList.add('alert-error'); alert.classList.remove('hidden'); form.classList.add('hidden'); return; }
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); alert.className = 'alert hidden';
                if (form.password.value !== form.confirmPassword.value) { alert.textContent = 'Passwords do not match'; alert.classList.add('alert-error'); alert.classList.remove('hidden'); return; }
                submitBtn.disabled = true; submitBtn.textContent = 'Saving...';
                try {
                    const result = await AuthService.apiCall('/reset-password', 'POST', { password: form.password.value, token });
                    if (result.success) { form.classList.add('hidden'); document.getElementById('success-message').classList.remove('hidden'); }
                    else { alert.textContent = result.error || 'Failed to reset password'; alert.classList.add('alert-error'); alert.classList.remove('hidden'); }
                } catch { alert.textContent = 'An unexpected error occurred'; alert.classList.add('alert-error'); alert.classList.remove('hidden'); }
                finally { submitBtn.disabled = false; submitBtn.textContent = 'Save New Password'; }
            });
        });
    </script>
</body>
</html>
