<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password</title><link rel="stylesheet" href="base.css"></head>
<body>
    <div class="auth-container">
        <img src="" alt="Logo" class="logo hidden">
        <h1 class="site-name" data-i18n="site_name">Awesome Auth</h1>
        <h2 data-i18n="forgot_password_title">Forgot Password</h2>
        <div id="alert" class="alert hidden"></div>
        <div id="form-container">
            <form id="forgot-form">
                <p class="footer-links" data-i18n="forgot_password_instruction">Enter your email to receive a reset link.</p>
                <div class="form-group"><label for="email" data-i18n="email_label">Email</label><input type="email" id="email" name="email" required placeholder="Enter your email" data-i18n="email_placeholder"></div>
                <button type="submit" id="submit-btn" data-i18n="send_reset_link_button">Send Reset Link</button>
            </form>
        </div>
        <div id="success-message" class="hidden">
            <div class="alert alert-success" data-i18n="forgot_password_success">Password reset email sent. Check your inbox.</div>
            <p class="footer-links"><a href="login" data-i18n="return_to_login_link">Return to login</a></p>
        </div>
        <div class="footer-links"><p><span data-i18n="remember_password_text">Remember your password?</span> <a href="login" data-i18n="login_link">Login</a></p></div>
    </div>
    <script src="auth.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthService.init();
            const form = document.getElementById('forgot-form');
            const alert = document.getElementById('alert');
            const submitBtn = document.getElementById('submit-btn');
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); alert.className = 'alert hidden';
                submitBtn.disabled = true; submitBtn.textContent = 'Sending...';
                try {
                    const result = await AuthService.apiCall('/forgot-password', 'POST', { email: form.email.value });
                    if (result.success) { document.getElementById('form-container').classList.add('hidden'); document.getElementById('success-message').classList.remove('hidden'); }
                    else { alert.textContent = result.error || 'Request failed'; alert.classList.add('alert-error'); alert.classList.remove('hidden'); }
                } catch { alert.textContent = 'An unexpected error occurred'; alert.classList.add('alert-error'); alert.classList.remove('hidden'); }
                finally { submitBtn.disabled = false; submitBtn.textContent = 'Send Reset Link'; }
            });
        });
    </script>
</body>
</html>
