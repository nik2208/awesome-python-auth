<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>2FA</title><link rel="stylesheet" href="base.css"></head>
<body>
    <div class="auth-container">
        <img src="" alt="Logo" class="logo hidden">
        <h1 class="site-name" data-i18n="site_name">Awesome Auth</h1>
        <h2 data-i18n="two_fa_title">Two-Factor Authentication</h2>
        <div id="alert" class="alert alert-error hidden"></div>
        <form id="2fa-form">
            <div class="form-group">
                <label for="code" data-i18n="two_fa_code_label">Verification Code</label>
                <input type="text" id="code" name="code" required placeholder="000000" data-i18n="two_fa_code_placeholder" style="text-align:center;letter-spacing:4px;font-size:18px">
            </div>
            <button type="submit" id="submit-btn" data-i18n="verify_code_button">Verify Code</button>
        </form>
        <div id="setup-section" class="hidden">
            <p class="footer-links" data-i18n="two_fa_setup_instruction">Scan this QR code with your authenticator app:</p>
            <img id="qr-code" style="display:block;margin:16px auto;width:200px;height:200px">
            <p class="footer-links" style="font-size:12px">Or enter manually: <strong id="secret"></strong></p>
        </div>
        <div class="footer-links"><a href="login">Back to login</a></div>
    </div>
    <script src="auth.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthService.init();
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const mode = params.get('mode') || 'verify';
            if (!token && mode !== 'setup') { window.location.href = 'login'; return; }
            const form = document.getElementById('2fa-form');
            const alert = document.getElementById('alert');
            const submitBtn = document.getElementById('submit-btn');
            if (mode === 'setup') {
                document.querySelector('h2').textContent = '2FA Setup';
                document.getElementById('setup-section').classList.remove('hidden');
                const setupData = await AuthService.apiCall('/2fa/setup', 'POST');
                if (setupData.qrCode) { document.getElementById('qr-code').src = setupData.qrCode; document.getElementById('secret').textContent = setupData.secret; }
            }
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); alert.className = 'alert alert-error hidden';
                submitBtn.disabled = true; submitBtn.textContent = 'Verifying...';
                try {
                    const endpoint = mode === 'setup' ? '/2fa/verify-setup' : '/2fa/verify';
                    const payload = mode === 'setup' ? { token: form.code.value, secret: document.getElementById('secret').textContent } : { tempToken: token, totpCode: form.code.value };
                    const result = await AuthService.apiCall(endpoint, 'POST', payload);
                    if (result.success) { window.location.href = '/'; }
                    else { alert.textContent = result.error || 'Verification failed'; alert.classList.remove('hidden'); }
                } catch { alert.textContent = 'An unexpected error occurred'; alert.classList.remove('hidden'); }
                finally { submitBtn.disabled = false; submitBtn.textContent = mode === 'setup' ? 'Verify Setup' : 'Verify Code'; }
            });
        });
    </script>
</body>
</html>
