<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magic Link</title><link rel="stylesheet" href="base.css"></head>
<body>
    <div class="auth-container">
        <img src="" alt="Logo" class="logo hidden">
        <h1 class="site-name" data-i18n="site_name">Awesome Auth</h1>
        <h2 data-i18n="magic_link_title">Magic Link</h2>
        <div id="alert" class="alert hidden"></div>
        <form id="magic-link-form">
            <p class="instruction-text" data-i18n="magic_link_instruction">Enter your email to receive a magic sign-in link.</p>
            <div class="form-group"><label for="email" data-i18n="email_label">Email</label><input type="email" id="email" name="email" required placeholder="Enter your email" data-i18n="email_placeholder"></div>
            <button type="submit" id="submit-btn" data-i18n="send_magic_link_button">Send Magic Link</button>
        </form>
        <div id="success-message" class="hidden">
            <div class="alert alert-success">Magic link sent! Check your inbox.</div>
        </div>
        <div class="footer-links"><a href="login">Back to login</a></div>
    </div>
    <script src="auth.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthService.init();
            const token = new URLSearchParams(window.location.search).get('token');
            const alert = document.getElementById('alert');
            const form = document.getElementById('magic-link-form');
            if (token) {
                form.classList.add('hidden');
                alert.textContent = 'Verifying your link...'; alert.className = 'alert'; alert.classList.remove('hidden');
                try {
                    const result = await AuthService.apiCall('/magic-link/verify', 'POST', { token });
                    if (result.success) { alert.textContent = 'Logged in! Redirecting...'; alert.className = 'alert alert-success'; setTimeout(() => window.location.href = '/', 1500); }
                    else { alert.textContent = result.error || 'Invalid or expired magic link'; alert.className = 'alert alert-error'; }
                } catch { alert.textContent = 'An unexpected error occurred'; alert.className = 'alert alert-error'; }
                return;
            }
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); alert.className = 'alert hidden';
                const btn = document.getElementById('submit-btn'); btn.disabled = true; btn.textContent = 'Sending...';
                try {
                    const result = await AuthService.apiCall('/magic-link/send', 'POST', { email: form.email.value, mode: 'login' });
                    if (result.success) { form.classList.add('hidden'); document.getElementById('success-message').classList.remove('hidden'); }
                    else { alert.textContent = result.error || 'Failed'; alert.className = 'alert alert-error'; alert.classList.remove('hidden'); }
                } catch { alert.textContent = 'An unexpected error occurred'; alert.className = 'alert alert-error'; alert.classList.remove('hidden'); }
                finally { btn.disabled = false; btn.textContent = 'Send Magic Link'; }
            });
        });
    </script>
</body>
</html>
